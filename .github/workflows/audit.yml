name: Security audit

# Advisories are published on their own schedule, not when we push. Running the
# audit here keeps a new advisory from failing CI on unrelated commits and pull
# requests; it fails this workflow instead, once a day or when dependencies change.
on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
