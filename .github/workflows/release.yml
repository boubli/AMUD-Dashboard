name: Release AMUD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-amd64:
    name: Build amd64 binaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-amd64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-amd64-cargo-

      - name: Build Projects in Release Mode
        run: GIT_TAG=${GITHUB_REF#refs/tags/} cargo build --release --locked

      - name: Stage amd64 binaries
        run: |
          set -euxo pipefail
          mkdir -p release-out
          cp target/release/amud-server release-out/amud-server
          cp target/release/amud-agent release-out/amud-agent
          ls -la release-out/

      - name: Upload amd64 binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amd64-binaries
          path: release-out/

  build-arm64:
    name: Build arm64 binaries
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Build Projects in Release Mode
        run: GIT_TAG=${GITHUB_REF#refs/tags/} cargo build --release --locked

      - name: Stage arm64 binaries
        run: |
          set -euxo pipefail
          mkdir -p release-out
          cp target/release/amud-server release-out/amud-server-arm64
          cp target/release/amud-agent release-out/amud-agent-arm64
          ls -la release-out/

      - name: Upload arm64 binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-binaries
          path: release-out/

  build-ui:
    name: Package UI assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Package UI Templates and Assets
        run: tar -czf ui.tar.gz ui/

      - name: Upload UI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tarball
          path: ui.tar.gz

  publish-release:
    name: Create GitHub Release
    needs: [build-amd64, build-arm64, build-ui]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Collect release files
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp release-assets/amd64-binaries/amud-server dist/
          cp release-assets/amd64-binaries/amud-agent dist/
          cp release-assets/arm64-binaries/amud-server-arm64 dist/
          cp release-assets/arm64-binaries/amud-agent-arm64 dist/
          cp release-assets/ui-tarball/ui.tar.gz dist/
          cd dist
          sha256sum amud-server amud-agent amud-server-arm64 amud-agent-arm64 ui.tar.gz > SHA256SUMS
          grep -qE '[[:space:]/]amud-server$' SHA256SUMS
          grep -qE '[[:space:]/]amud-agent$' SHA256SUMS
          grep -qE '[[:space:]/]amud-server-arm64$' SHA256SUMS
          grep -qE '[[:space:]/]amud-agent-arm64$' SHA256SUMS
          grep -qE '[[:space:]/]ui\.tar\.gz$' SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/amud-server
            dist/amud-agent
            dist/amud-server-arm64
            dist/amud-agent-arm64
            dist/ui.tar.gz
            dist/SHA256SUMS
            setup-amud.sh
            update-amud.sh
            uninstall-amud.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
