<!DOCTYPE html>
<html lang="{{ui_language}}" data-theme="{{theme_mode}}" data-theme-id="{{active_theme_id}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{app_name}} - {{t:Sign In}}</title>
    <link rel="icon" href="{{favicon_url}}" type="{{favicon_type}}">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="{{accent_color}}">
    <meta name="description" content="{{app_name}} administrative sign in">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{app_name}}">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{{apple_touch_icon_url}}">
    <link rel="stylesheet" href="/static/style.css?v={{app_version}}">
    <script id="amud-theme-config" type="application/json">{{theme_scheduler_config}}</script>
    <script src="/static/theme-scheduler.js"></script>
    <!-- I18N_CONFIG -->
    <script src="/static/i18n.js?v={{app_version}}"></script>
    <script src="/static/theme-engine.js?v={{app_version}}"></script>

    <style>
        :root {
            /* ROOT_CSS */
        }

        body.login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
        }

        .login-shell {
            position: relative;
            z-index: 10;
            max-width: 400px;
            width: 100%;
        }

        .login-brand-logo {
            width: 3.5rem;
            height: 3.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
    <style id="amud-custom-css">{{custom_css}}</style>

    <script src="/static/vendor/lucide.min.js"></script>
</head>
<body data-theme-id="{{active_theme_id}}" class="login-page theme-{{active_theme_id}} {{video_bg_class}}">
    {{video_bg_element}}

    <div class="login-shell">
        <div class="glass-panel" style="padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">

            <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                <div class="brand-logo login-brand-logo">{{if app_logo}}<img src="{{app_logo}}" alt="{{app_name}}" class="brand-logo-img">{{end}}</div>
                <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em;">{{t:Sign In}}</h2>
                <p style="font-size: 0.8rem; color: var(--text-secondary);">{{tagline}}</p>
            </div>

            <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div id="error-message" style="display: none; background: #991b1b; color: #ffffff; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; text-align: center; border: 1px solid #b91c1c;">
                    {{t:Invalid username or password}}
                </div>

                <div class="form-group">
                    <label for="username">{{t:Username}}</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="{{t:Username}}" required>
                </div>

                <div class="form-group">
                    <label for="password">{{t:Password}}</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    {{t:Sign In}}
                </button>

                {{oidc_sso_block}}

                <a href="/" style="text-align: center; font-size: 0.8rem; color: var(--text-secondary); text-decoration: none; display: block; margin-top: 0.25rem;">
                    {{t:Return to Dashboard as Guest}}
                </a>
            </form>
        </div>
    </div>

    <script nonce="{{csp_nonce}}">
        lucide.createIcons();
        if (new URLSearchParams(globalThis.window.location.search).get('error') === '1') {
            document.getElementById('error-message').style.display = 'block';
            globalThis.window.history.replaceState({}, document.title, "/login");
        }
    </script>
    <script nonce="{{csp_nonce}}">
        if ('serviceWorker' in navigator) {
            globalThis.window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
</body>
</html>
