[package]
name = "amud-server"
version = "1.9.5"
edition = "2021"

[lib]
name = "amud_server"
path = "src/lib.rs"

[dependencies]
amud-protocol = { path = "../amud-protocol" }
chacha20poly1305 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
oauth2 = { version = "5", default-features = false }
once_cell = "1"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.23"
getrandom = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
feed-rs = "3"
md5 = "0.8"
urlencoding = "2"
serde_yaml = "0.9"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
mimalloc = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"

[features]
integration-tests = []
