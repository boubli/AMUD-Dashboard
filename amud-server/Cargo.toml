[package]
name = "amud-server"
version = "1.9.3"
edition = "2021"

[lib]
name = "amud_server"
path = "src/lib.rs"

[dependencies]
amud-protocol = { path = "../amud-protocol" }
chacha20poly1305 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
oauth2 = { version = "4", default-features = false }
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
feed-rs = "2"
md5 = "0.7"
urlencoding = "2"
serde_yaml = "0.9"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
mimalloc = { version = "0.1", default-features = false }

[features]
integration-tests = []
