name: Security audit

# Advisories are published on their own schedule, not when we push. Running the
# audit here keeps a new advisory from failing CI on unrelated commits and pull
# requests; it fails this workflow instead, once a day or when dependencies change.
#
# cargo-deny checks the resolved graph for the Linux targets we ship, so optional
# lockfile entries that are never compiled (for example HTTP/3 under reqwest) do
# not fail the job.
on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Match release/CI builds: do not enable unused optional features.
          arguments: ''
          command: check
          command-arguments: advisories
