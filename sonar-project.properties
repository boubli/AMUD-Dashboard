sonar.projectKey=boubli_AMUD-Dashboard
sonar.organization=boubli

# --- Path exclusions ---
# Theme packs and guards intentionally override base UI with !important / motion.
# Docs gallery mirrors are copies of the same packs. Localized READMEs are clones.
sonar.exclusions=\
  **/docs/static/themes/**,\
  **/docs/static/theme-layouts/**,\
  **/ui/static/themes/**,\
  **/ui/static/theme-guards.css,\
  **/readmes/**

sonar.cpd.exclusions=**/docs/**,**/readmes/**,**/ui/static/themes/**

# --- Rule ignores (paths Sonar still scans) ---
# css:S4656 = "!important" — needed where themes/base UI fight specificity
# css:S6851 = prefers-reduced-motion — decorative theme motion; app respects OS elsewhere
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4656
sonar.issue.ignore.multicriteria.e1.resourceKey=**/style.css

sonar.issue.ignore.multicriteria.e2.ruleKey=css:S4656
sonar.issue.ignore.multicriteria.e2.resourceKey=**/custom.css

sonar.issue.ignore.multicriteria.e3.ruleKey=css:S4656
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.module.css

sonar.issue.ignore.multicriteria.e4.ruleKey=css:S6851
sonar.issue.ignore.multicriteria.e4.resourceKey=**/style.css

sonar.issue.ignore.multicriteria.e5.ruleKey=css:S6851
sonar.issue.ignore.multicriteria.e5.resourceKey=**/custom.css

sonar.issue.ignore.multicriteria.e6.ruleKey=css:S6851
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.module.css
