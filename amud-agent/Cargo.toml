[package]
name = "amud-agent"
version = "1.9.3"
edition = "2021"


[dependencies]
amud-protocol = { path = "../amud-protocol" }
sysinfo = "0.30.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
hyperlocal = "0.9"
