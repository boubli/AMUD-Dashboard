sonar.projectKey=boubli_AMUD-Dashboard
sonar.organization=boubli

# Used by CI-based SonarCloud analysis (see .github/workflows/ci.yml).
# Keep in sync with .sonarcloud.properties (Automatic Analysis).
# Theme packs / guards intentionally use !important + decorative motion.
sonar.exclusions=docs/static/themes/**,docs/static/theme-layouts/**,ui/static/themes/**,ui/static/theme-guards.css,readmes/**
sonar.cpd.exclusions=docs/**,readmes/**,ui/static/themes/**

sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4656
sonar.issue.ignore.multicriteria.e1.resourceKey=**/style.css
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S6851
sonar.issue.ignore.multicriteria.e2.resourceKey=**/style.css
